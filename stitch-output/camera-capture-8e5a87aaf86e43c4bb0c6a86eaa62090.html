<style>

            backdrop-filter: blur(2px);

        .corner-border {

            height: 2px;

<body class="bg-background text-on-background overflow-hidden font-body-md select-none">
<!-- Camera Viewport Layer -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center transition-opacity duration-700" data-alt="A POV shot from a high-end smartphone camera capturing a professional legal document on a dark mahogany desk. The lighting is focused and cinematic with a primary electric teal glow from the digital interface overlapping the scene. The overall mood is sophisticated, corporate, and precise, mirroring a modern SaaS application for property compliance." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBR2synB-iXMN-X7n-VasMSFAUwNznVhyP-X5wBsp_wrL-6bBRbHOBjJSHUJsBstDurIkkaqaQPrvwzMISYh-cLWCSCklMWWOzjfnSZ6GAR2wzYMatYTPU9qjto9fRvGmpyaI-ZJW3-R_QU6iXguj1sMY60NnjMd6md34_3VVbwLo2yBbLDwpJGPSqjdXSuyySwIHICUbg_S13uHnfTEkt2ChlkuBSS-Jd1MH5BjQU6SxGsA9KPB8apyw')"></div>
</div>
<!-- UI Overlay Layer -->
<div class="fixed inset-0 z-10 flex flex-col justify-between">
<!-- Top Controls: Header suppress navigation but provides context -->
<header class="flex justify-between items-center px-container-padding-mobile pt-8 pb-4 bg-gradient-to-b from-background/80 to-transparent">
<button class="p-2 rounded-full bg-surface-container/40 backdrop-blur-md text-on-surface hover:bg-surface-container-high transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
</button>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-white drop-shadow-md">Scan Document</h1>
<p class="font-label-sm text-label-sm text-primary uppercase tracking-widest mt-1">Proof of Insurance</p>
</div>
<button class="p-2 rounded-full bg-surface-container/40 backdrop-blur-md text-on-surface">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Viewfinder Center -->
<div class="relative flex-grow flex items-center justify-center overflow-hidden">
<!-- Semi-transparent mask -->
<div class="absolute inset-0 camera-overlay"></div>
<!-- Document Guide Frame -->
<div class="relative w-[85%] h-[55%] pointer-events-none">
<!-- Corners -->
<div class="corner-border top-0 left-0 border-t border-l rounded-tl-xl"></div>
<div class="corner-border top-0 right-0 border-t border-r rounded-tr-xl"></div>
<div class="corner-border bottom-0 left-0 border-b border-l rounded-bl-xl"></div>
<div class="corner-border bottom-0 right-0 border-b border-r rounded-br-xl"></div>
<!-- Scanning Animation -->
<div class="absolute left-0 right-0 scan-line"></div>
<!-- Guidance Text -->
<div class="absolute -bottom-16 left-0 right-0 text-center">
<p class="font-label-md text-label-md text-on-surface bg-surface/40 backdrop-blur-xl inline-block px-4 py-2 rounded-full border border-outline-variant/30">
                        Align document within the frame
                    </p>
</div>
</div>
</div>

</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary">Gallery</span>
</div>
<!-- Shutter Button -->
<button class="relative w-20 h-20 flex items-center justify-center group" id="shutter">
<div class="absolute inset-0 rounded-full border-4 border-white opacity-40 group-hover:scale-105 transition-transform duration-300"></div>
<div class="w-16 h-16 rounded-full bg-white shutter-ring shadow-[0_0_20px_rgba(255,255,255,0.4)] flex items-center justify-center">
<div class="w-[90%] h-[90%] rounded-full border border-surface/10"></div>
</div>
</button>
<!-- Flash Toggle -->
<div class="flex flex-col items-center gap-2 group cursor-pointer" id="flash-toggle" onclick="toggleFlash()">
<div class="w-12 h-12 rounded-xl bg-surface-container-high/60 backdrop-blur-md border border-outline-variant flex items-center justify-center transition-all duration-300" id="flash-icon-container">
<span class="material-symbols-outlined text-on-surface" data-icon="flash_off" id="flash-icon">flash_off</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary" id="flash-label">Flash Off</span>
</div>
</footer>
</div>
<!-- Haptic/Flash Feedback Element -->
<div class="fixed inset-0 z-50 bg-white pointer-events-none opacity-0" id="screen-flash"></div>
<script>
        // Micro-interaction for Shutter
        const shutter = document.getElementById('shutter');
        const screenFlash = document.getElementById('screen-flash');

        shutter.addEventListener('click', () => {
            // Trigger Visual Flash
            screenFlash.classList.remove('opacity-0');
            screenFlash.classList.add('opacity-100');
            
            setTimeout(() => {
                screenFlash.classList.remove('opacity-100');
                screenFlash.classList.add('opacity-0');
                // Simulate capture success with a subtle notification
                console.log('Document Captured');
            }, 100);
        });

        // Flash Toggle Logic
        let flashActive = false;
        function toggleFlash() {
            flashActive = !flashActive;
            const icon = document.getElementById('flash-icon');
            const label = document.getElementById('flash-label');
            const container = document.getElementById('flash-icon-container');

            if (flashActive) {
                icon.innerText = 'flash_on';
                label.innerText = 'Flash On';
                container.classList.add('border-primary');
                container.classList.add('bg-primary/10');
                icon.classList.add('text-primary');
            } else {
                icon.innerText = 'flash_off';
                label.innerText = 'Flash Off';
                container.classList.remove('border-primary');
                container.classList.remove('bg-primary/10');
                icon.classList.remove('text-primary');
            }
        }

        // Perspective Parallax Micro-effect
        document.addEventListener('mousemove', (e) => {
            const viewport = document.querySelector('.relative.w-\\[85\\%\\]');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            viewport.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
