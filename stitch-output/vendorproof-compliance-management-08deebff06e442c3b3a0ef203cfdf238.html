<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0F19;
      color: #e1e3e4;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid #1F2937;
    }
    .input-focus-ring:focus {
      outline: none;
      border-color: #57f1db;
      box-shadow: 0 0 0 2px rgba(87, 241, 219, 0.1);
    }
    /* Subtle background glow effect */
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.05) 0%, rgba(11, 15, 25, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-secondary-fixed-variant": "#434652",
            "surface-container-high": "#282a2b",
            "on-surface": "#e1e3e4",
            "surface-container-low": "#191c1d",
            "surface-container": "#1d2021",
            "primary-container": "#2dd4bf",
            "on-secondary-fixed": "#171b26",
            "on-primary-container": "#00574d",
            "error-container": "#93000a",
            "on-primary-fixed-variant": "#005047",
            "surface-tint": "#3cddc7",
            "primary-fixed-dim": "#3cddc7",
            "secondary": "#c3c6d4",
            "tertiary-container": "#b7bed2",
            "surface-container-lowest": "#0c0f10",
            "primary-fixed": "#62fae3",
            "inverse-on-surface": "#2e3132",
            "inverse-surface": "#e1e3e4",
            "error": "#ffb4ab",
            "secondary-fixed-dim": "#c3c6d4",
            "tertiary-fixed": "#dce2f7",
            "on-secondary": "#2c303b",
            "on-tertiary-fixed-variant": "#404758",
            "on-primary": "#003731",
            "surface-variant": "#323536",
            "surface": "#111415",
            "outline-variant": "#3c4a46",
            "on-tertiary-fixed": "#141b2b",
            "secondary-fixed": "#dfe2f1",
            "on-surface-variant": "#bacac5",
            "inverse-primary": "#006b5f",
            "surface-dim": "#111415",
            "secondary-container": "#454955",
            "on-tertiary": "#293040",
            "tertiary": "#d3daef",
            "background": "#111415",
            "on-background": "#e1e3e4",
            "on-primary-fixed": "#00201c",
            "on-error-container": "#ffdad6",
            "on-error": "#690005",
            "surface-bright": "#373a3b",
            "tertiary-fixed-dim": "#c0c6db",
            "primary": "#57f1db",
            "on-tertiary-container": "#464d5e",
            "on-secondary-container": "#b5b8c6",
            "outline": "#859490",
            "surface-container-highest": "#323536"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "stack-sm": "8px",
            "container-padding-desktop": "32px",
            "container-padding-mobile": "16px",
            "base": "8px",
            "stack-lg": "24px",
            "gutter": "16px",
            "stack-md": "16px"
          },
          "fontFamily": {
            "body-md": ["Inter"],
            "label-sm": ["Inter"],
            "headline-lg-mobile": ["Inter"],
            "headline-lg": ["Inter"],
            "title-lg": ["Inter"],
            "display": ["Inter"],
            "body-lg": ["Inter"],
            "label-md": ["Inter"],
            "headline-md": ["Inter"]
          },
          "fontSize": {
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "300"}],
            "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "300"}],
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
            "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<!-- Background Decorative Element -->
<div class="bg-glow"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Identity Header -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-16 h-16 mb-stack-md flex items-center justify-center rounded-xl bg-primary/10 border border-primary/20 shadow-[0_0_20px_rgba(87,241,219,0.15)]">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="verified_user">verified_user</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">VendorProof</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Compliance Simplified.</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl">
<form class="space-y-stack-md" onsubmit="event.preventDefault()">
<!-- Email Input Group -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 bg-[#030712] border border-outline-variant rounded-lg px-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 input-focus-ring transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-12 bg-[#030712] border border-outline-variant rounded-lg px-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 input-focus-ring transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_14px_rgba(87,241,219,0.2)]" type="submit">
            Login
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant/50">OR</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Auth -->
<button class="w-full h-12 border border-primary/30 text-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-3 hover:bg-primary/5 active:scale-[0.98] transition-all" type="button">
<svg fill="currentColor" height="20" viewbox="0 0 24 24" width="20">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
          Continue with Google
        </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg flex flex-col items-center space-y-2">
<p class="font-label-md text-label-md text-on-surface-variant">
        Don't have an account? <a class="text-primary hover:underline" href="#">Request Access</a>
</p>
<div class="flex gap-4 pt-4 border-t border-outline-variant/20 w-full justify-center">
<a class="font-label-sm text-label-sm text-on-surface-variant/60 hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant/60 hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
</main>
<script>
    // Subtle mouse movement parallax for the glow
    document.addEventListener('mousemove', (e) => {
      const glow = document.querySelector('.bg-glow');
      const x = e.clientX;
      const y = e.clientY;
      
      const moveX = (x - window.innerWidth / 2) / 20;
      const moveY = (y - window.innerHeight / 2) / 20;
      
      glow.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
    });

    // Form interaction effects
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.parentElement.classList.add('scale-[1.01]');
        input.parentElement.parentElement.style.transition = 'all 0.3s ease';
      });
      input.addEventListener('blur', () => {
        input.parentElement.parentElement.classList.remove('scale-[1.01]');
      });
    });
  </script>
</body></html>
